<body>
    <header>
        <h1>Svampletarna</h1>

    <nav>
        <ul>
            <li><a href="../index.html">Startsida</a></li>
            <li><a href="./svampar.html">Svampförteckning</a></li>

    <main>   
        <section class="intro">
            <article>
                <h2>Blogg</h2>
                <p>Här kan du logga in för att skriva inlägg i vår blogg.</p>
                <p>Om du inte har ett konto kan du registrera dig på sidan "Registrera".</p>
            </article>    
        <form id="formen" method="get">
            <p>
                <label for="username">Namn:</label>
                <input type="text" id="username" placeholder="Namn" name="namn" required>
            </p>
            <p>
                <label for="password">Lösenord:</label>
                <input type="password" id="password" placeholder="Lösenord" name="password" required>
            </p>
            <p>
                <input id="vidare" type="submit" value="Logga in">
            </p>
        </form>
            <p class="message" id="message"></p>
            <p class="welcome" id="welcome"></p>            
            <button id="logout">Logga ut</button>
    </main>
</body>
</html>
