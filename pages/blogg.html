<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svampletarna</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../compiled/blogg.js" defer></script>
</head>
<body>
    <header>
        <h1>Svampletarna</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html">Startsida</a></li>
            <li><a href="./svampar.html">Svampförteckning</a></li>
            <li><a href="./forvaxling.html">Förväxlingssvampar</a></li>
            <li><a href="./minasvampar.html">Mina svampar</a></li>
            <li><a href="./blogg.html">Blogg</a></li>
        </ul>
    </nav>
    <main>   
        <section class="intro">
            <article>
                <h2>Blogg</h2>
                <p id="loginMessage">Logga in för att skriva ett inlägg</p>
            </article>   
            <form id="form" method="get">
                <p>
                    <label for="username">Namn:</label>
                    <input type="text" id="username" placeholder="Namn" name="namn" required>
                </p>
                <p>
                    <label for="password">Lösenord:</label>
                    <input type="password" id="password" placeholder="Lösenord" name="password" required>
                </p>
                <p>
                    <input id="login" type="submit" value="Logga in">
                </p>
            </form>
                <p class="message" id="message"></p>
                <p class="welcome" id="welcome"></p>            
                <button id="logout">Logga ut</button>
        </section> 

        <section id="blogg">   <!-- Här skriver användaren inlägg -->
            <form id="bloggForm">
                <label for="title">Rubrik:</label>
                <input type="text" id="title" required>
                <label for="text">Innehåll:</label>
                <textarea id="text" required></textarea>
                <button type="submit" id="publish">Publicera inlägg</button>
            </form>
        </section>
        <section id="bloggPrint">
            <!--Här skrivs inlägget ut-->
        </section>

    </main>
    <footer>
        <p>&copy;Svampletarna 2026</p>
    </footer>
</body>
</html>
